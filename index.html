<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Günlük Rapor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Günlük Rapor">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0a1220;--card:#0f1a2e;--line:#22345a;--tx:#eaf1ff;--mut:#8ea0c4;--blue:#2f8bff;--red:#ff3b4a;--green:#22c97a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px}
#report{background:var(--bg);padding:4px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.head h1{font-size:17px;margin:0;line-height:1.2}
.head input{background:#0a1220;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.st{border:2px solid;border-radius:14px;padding:10px 8px;text-align:center;background:var(--card)}
.st label{display:block;font-size:12.5px;font-weight:600;min-height:32px}
.st input{width:100%;background:transparent;border:0;color:var(--tx);font-size:34px;font-weight:700;text-align:center;outline:0;padding:0}
.st.b{border-color:var(--blue)}.st.r{border-color:var(--red)}.st.g{border-color:var(--green)}
.tbl{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.row{display:grid;grid-template-columns:1.2fr .8fr 1.4fr}
.row>*{border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.row>*:last-child{border-right:0}
.row.th>div{padding:10px 8px;font-size:12.5px;font-weight:700;background:#101e38}
.row input{background:transparent;border:0;color:var(--tx);font-size:16px;padding:12px 8px;width:100%;outline:0}
.row:last-child>*{border-bottom:0}
.sign{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.sign .l{flex:1;min-width:0}.sign b{font-size:14px}
.sign input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--mut);font-size:15px;padding:6px 0;outline:0;margin-top:4px}
#sig{width:150px;height:70px;background:#0a1220;border:1px dashed var(--line);border-radius:10px;touch-action:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;border:0;border-radius:12px;padding:14px;cursor:pointer;color:#fff}
.add{background:var(--card);border:1px solid var(--line);color:var(--tx);flex:1}
.clr{padding:14px 10px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.save{background:linear-gradient(#2f8bff,#1566e0);flex:1 1 100%;order:5;font-weight:700;font-size:17px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:17px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fm button{background:#14264a;border:1px solid var(--line);font-size:16px}
.cancel{width:100%;margin-top:8px;background:transparent;color:var(--mut)}
#msg{margin-top:10px;font-size:14px;color:var(--mut);text-align:center;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
 <div id="report">
  <div class="head"><h1>👥 Günlük Personel ve Ürün Raporu</h1><input type="date" id="date"></div>
  <div class="stats">
   <div class="st b"><label for="active">Aktif Çalışan Personel</label><input id="active" type="number" inputmode="numeric" min="0" placeholder="0"></div>
   <div class="st r"><label for="absent">Gelmeyen Kişi Sayısı</label><input id="absent" type="number" inputmode="numeric" min="0" placeholder="0"></div>
   <div class="st g"><label for="leave">İzinli Olanlar</label><input id="leave" type="number" inputmode="numeric" min="0" placeholder="0"></div>
  </div>
  <div class="tbl" id="tbl">
   <div class="row th"><div>Kişi Adı Soyadı</div><div>Okuttuğu Ürün Miktarı</div><div>Okuttuğu Ürün İçeriği</div></div>
  </div>
  <div class="sign">
   <div class="l"><b>Takım Lideri Onay İmzası</b><input id="leader" placeholder="Adı Soyadı"></div>
   <canvas id="sig" width="300" height="140"></canvas>
  </div>
 </div>
 <div class="bar"><button class="add" id="addRow">+ Satır ekle</button><button class="clr" id="clrSig">İmzayı sil</button><button class="clr" id="newDay">Temizle</button><button class="save" id="save">💾 Kaydet</button></div>
 <div id="msg"></div>
</div>

<div id="modal"><div class="sheet"><h2>Hangi formatta kaydedilsin?</h2>
 <div class="fm"><button data-f="pdf">📄 PDF</button><button data-f="docx">📝 Word</button><button data-f="xlsx">📊 Excel</button><button data-f="png">🖼️ Görsel</button></div>
 <button class="cancel" id="cancel">Vazgeç</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const tbl=$('tbl');
function addRow(){const r=document.createElement('div');r.className='row dr';
 r.innerHTML='<input class="n" placeholder="Ad Soyad"><input class="q" inputmode="numeric" placeholder="0"><input class="c" placeholder="Ürün">';tbl.appendChild(r);}
for(let i=0;i<10;i++)addRow();
$('addRow').onclick=addRow;
const d=new Date();$('date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const trDate=()=>{const v=$('date').value;if(!v)return'';const[y,m,dd]=v.split('-');return dd+'.'+m+'.'+y;};

// imza
const sig=$('sig'),cx=sig.getContext('2d');let dr=false;
cx.strokeStyle='#cfe0ff';cx.lineWidth=3;cx.lineCap='round';
const pos=e=>{const b=sig.getBoundingClientRect();return[(e.clientX-b.left)*sig.width/b.width,(e.clientY-b.top)*sig.height/b.height];};
sig.addEventListener('pointerdown',e=>{dr=true;sig.setPointerCapture(e.pointerId);const[x,y]=pos(e);cx.beginPath();cx.moveTo(x,y);});
sig.addEventListener('pointermove',e=>{if(!dr)return;const[x,y]=pos(e);cx.lineTo(x,y);cx.stroke();});
['pointerup','pointercancel'].forEach(ev=>sig.addEventListener(ev,()=>dr=false));
$('clrSig').onclick=()=>cx.clearRect(0,0,sig.width,sig.height);

function data(){
 const rows=[...document.querySelectorAll('.dr')].map(r=>[r.querySelector('.n').value.trim(),r.querySelector('.q').value.trim(),r.querySelector('.c').value.trim()]).filter(r=>r.some(Boolean));
 return{date:trDate(),active:$('active').value||'0',absent:$('absent').value||'0',leave:$('leave').value||'0',leader:$('leader').value.trim(),rows};
}
const fname=ext=>'Gunluk_Rapor_'+($('date').value||'rapor')+'.'+ext;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function shot(){
 const c=await html2canvas($('report'),{backgroundColor:'#0a1220',scale:2,onclone:doc=>{
  doc.querySelectorAll('input').forEach(i=>{if(i.type==='date'){const s=doc.createElement('div');s.textContent=trDate();s.style.cssText='padding:8px;font-size:15px;border:1px solid #22345a;border-radius:10px';i.replaceWith(s);return;}
   const s=doc.createElement('div');s.textContent=i.value||'';s.style.cssText='padding:'+(i.closest('.row')?'12px 8px':'0')+';min-height:'+(i.closest('.row')?'46px':'auto')+';font-size:'+getComputedStyle(i).fontSize+';font-weight:'+getComputedStyle(i).fontWeight+';text-align:'+getComputedStyle(i).textAlign+';color:'+getComputedStyle(i).color+';word-break:break-word';i.replaceWith(s);});
 }});return c;
}

async function build(f){
 if(f==='png'){const c=await shot();return new Promise(r=>c.toBlob(b=>r(b),'image/png'));}
 if(f==='pdf'){const c=await shot();const{jsPDF}=window.jspdf;const w=210,mar=8;const iw=w-2*mar,ih=c.height*iw/c.width;
  const pdf=new jsPDF({unit:'mm',format:[w,Math.max(ih+2*mar,100)]});pdf.setFillColor(10,18,32);pdf.rect(0,0,w,ih+2*mar,'F');
  pdf.addImage(c.toDataURL('image/png'),'PNG',mar,mar,iw,ih);return new Blob([pdf.output('arraybuffer')],{type:'application/pdf'});}
 const D=data();
 if(f==='xlsx'){const a=[['Günlük Personel ve Ürün Raporu',D.date],[],['Aktif Çalışan Personel',+D.active],['Gelmeyen Kişi Sayısı',+D.absent],['İzinli Olanlar',+D.leave],[],['Kişi Adı Soyadı','Okuttuğu Ürün Miktarı','Okuttuğu Ürün İçeriği'],...D.rows.map(r=>[r[0],r[1]!==''&&!isNaN(r[1])?+r[1]:r[1],r[2]]),[],['Takım Lideri',D.leader]];
  const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=[{wch:30},{wch:24},{wch:34}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Rapor');
  return new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/octet-stream'});}
 if(f==='docx'){
  const p=(t,b)=>'<w:p><w:r>'+(b?'<w:rPr><w:b/></w:rPr>':'')+'<w:t xml:space="preserve">'+esc(t)+'</w:t></w:r></w:p>';
  const cell=(t,b)=>'<w:tc><w:tcPr><w:tcW w:w="3000" w:type="dxa"/></w:tcPr>'+p(t,b)+'</w:tc>';
  const tr=(r,b)=>'<w:tr>'+r.map(x=>cell(x,b)).join('')+'</w:tr>';
  const tb='<w:tbl><w:tblPr><w:tblW w:w="9000" w:type="dxa"/><w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(s=>'<w:'+s+' w:val="single" w:sz="4" w:color="888888"/>').join('')+'</w:tblBorders></w:tblPr>'+tr(['Kişi Adı Soyadı','Okuttuğu Ürün Miktarı','Okuttuğu Ürün İçeriği'],true)+D.rows.map(r=>tr(r)).join('')+'</w:tbl>';
  const body=p('Günlük Personel ve Ürün Raporu',true)+p('Tarih: '+D.date)+p('Aktif Çalışan Personel: '+D.active)+p('Gelmeyen Kişi Sayısı: '+D.absent)+p('İzinli Olanlar: '+D.leave)+p('')+tb+p('')+p('Takım Lideri Onay: '+D.leader);
  const z=new JSZip();
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/document.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr></w:body></w:document>');
  return z.generateAsync({type:'blob'});}
}

const MIME={pdf:'application/pdf',png:'image/png',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function saveFile(blob,name){
 const ext=name.split('.').pop();const file=new File([blob],name,{type:MIME[ext]||blob.type});
 if(isIOS&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:name});return'ok';}
  catch(e){if(e.name==='NotAllowedError'){msg.innerHTML='';const b=document.createElement('button');b.textContent='Paylaş / Kaydet: '+name;b.className='add';b.onclick=async()=>{try{await navigator.share({files:[file],title:name});msg.textContent='Kaydedildi ✓';}catch(x){msg.textContent=x.name==='AbortError'?'':'Kaydedilemedi';}};msg.appendChild(b);return'pending';}throw e;}
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),20000);return'ok';
}
const modal=$('modal'),msg=$('msg');
$('save').onclick=()=>{msg.textContent='';modal.classList.add('on');};
$('cancel').onclick=()=>modal.classList.remove('on');
modal.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{
 const f=b.dataset.f;modal.classList.remove('on');msg.textContent='Hazırlanıyor…';
 try{
  const blob=await build(f);
  const r=await saveFile(blob,fname(f));
  if(r!=='pending')msg.textContent='Kaydedildi ✓';
 }catch(e){msg.textContent=(e&&e.name==='AbortError')?'Kaydetme iptal edildi.':'Kaydedilemedi: '+(e&&(e.message||e.name)||'hata');}
});
const KEY='gunluk-rapor-v1';
function saveState(){try{localStorage.setItem(KEY,JSON.stringify({active:$('active').value,absent:$('absent').value,leave:$('leave').value,leader:$('leader').value,rows:[...document.querySelectorAll('.dr')].map(r=>[r.querySelector('.n').value,r.querySelector('.q').value,r.querySelector('.c').value]),sig:sig.toDataURL()}));}catch(e){}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s)return;
 ['active','absent','leave','leader'].forEach(k=>$(k).value=s[k]||'');
 while(document.querySelectorAll('.dr').length<s.rows.length)addRow();
 document.querySelectorAll('.dr').forEach((r,i)=>{const v=s.rows[i]||['','',''];r.querySelector('.n').value=v[0];r.querySelector('.q').value=v[1];r.querySelector('.c').value=v[2];});
 if(s.sig){const im=new Image();im.onload=()=>cx.drawImage(im,0,0);im.src=s.sig;}
}catch(e){}}
loadState();
document.addEventListener('input',saveState);
sig.addEventListener('pointerup',saveState);
$('clrSig').addEventListener('click',saveState);
$('addRow').addEventListener('click',saveState);
$('newDay').onclick=()=>{if(!confirm('Tüm girişler silinsin mi? (Yeni gün)'))return;document.querySelectorAll('.st input,.row input,#leader').forEach(i=>i.value='');cx.clearRect(0,0,sig.width,sig.height);saveState();};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
